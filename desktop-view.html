<!DOCTYPE html>
<html>

</head>
<body>
  <h2>Latest Scanned Data:</h2>
  <div id="scan-result" style="font-size: 1.5em; color: darkgreen;">Waiting...</div>

  <script>
   const firebaseConfig = {

  authDomain: "universitymodule-8fac5.firebaseapp.com",
  projectId: "universitymodule-8fac5",

  messagingSenderId: "154631878754",
  appId: "1:154631878754:web:7243c8fe784abc1626393b",
  measurementId: "G-8TJ9ZWEK6M"
};

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const scanRef = firebase.database().ref("scans/scanData");

    scanRef.on("value", (snapshot) => {
      const data = snapshot.val();
      document.getElementById("scan-result").textContent = data || "No scan yet.";
    });
  </script>
</body>
</html>
