/* =========================================================================
   3. DATABASE — device storage only (window.localStorage), no server
   ========================================================================= */
const STORAGE_KEY = 'family_tree_people_v1';
const DB = {
  _read(){ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; },
  _write(data){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); },
  async getAll(){
    let data = this._read();
    if (!data) { data = seedDummyData(); this._write(data); }
    return data;
  },
  async setPerson(id, person){ const data = this._read() || {}; data[id] = person; this._write(data); },
  async deletePerson(id){ const data = this._read() || {}; delete data[id]; this._write(data); },
  async resetToDummy(){ const data = seedDummyData(); this._write(data); return data; },
  subscribe(cb){
    // keeps multiple tabs on the same device in sync
    const handler = () => this.getAll().then(cb);
    window.addEventListener('storage', handler);
    return () => window.removeEventListener('storage', handler);
  },
};

/* =========================================================================
   4. STATE
   ========================================================================= */
let people = {};
let rootId = null;

function genId(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

// Pick a sensible default root: the person in the deepest ("lowest") generation,
// so their ancestors are visible above them by default.
function pickDefaultRoot(peopleMap){
  const ids = Object.keys(peopleMap);
  if (!ids.length) return null;
  const depth = {};
  function getDepth(id, visiting){
    if (depth[id] !== undefined) return depth[id];
    if (visiting.has(id)) return 0;
    visiting.add(id);
    const p = peopleMap[id];
    const parentIds = (p && p.parents) || [];
    let maxParentDepth = -1;
    parentIds.forEach(pid => {
      if (peopleMap[pid]) maxParentDepth = Math.max(maxParentDepth, getDepth(pid, visiting));
    });
    depth[id] = maxParentDepth + 1;
    return depth[id];
  }
  ids.forEach(id => getDepth(id, new Set()));
  let best = ids[0], bestDepth = -1;
  ids.forEach(id => { if (depth[id] > bestDepth) { bestDepth = depth[id]; best = id; } });
  return best;
}

function personName(p){ return lang === 'ml' && p.nameMl ? p.nameMl : (p.nameEn || '(unnamed)'); }
function isMlName(p){ return lang === 'ml' && !!p.nameMl; }
function avatarFor(p){
  if (p.photoUrl) return p.photoUrl;
  const seed = encodeURIComponent(p.nameEn || 'Person');
  const bg = p.gender === 'F' ? 'CD8790' : '6C8F76';
  return `https://ui-avatars.com/api/?name=${seed}&background=${bg}&color=fff&size=128&font-size=0.36`;
}

/* =========================================================================
   5. RENDERING
   ========================================================================= */
function nodeCard(id){
  const p = people[id];
  if (!p) return '';
  const ringColor = p.gender === 'F' ? 'ring-rose/40' : 'ring-leaf/40';
  const borderColor = p.gender === 'F' ? 'border-rose-light' : 'border-leaf-light';
  const isRootRing = id === rootId ? 'ring-4 ring-gold shadow-cardHover scale-[1.05]' : 'ring-2 ' + ringColor;
  const birthYear = p.dob ? p.dob.slice(0,4) : '';
  const deathYear = p.dod ? p.dod.slice(0,4) : '';
  const years = birthYear ? (birthYear + (deathYear ? ' \u2013 ' + deathYear : '')) : '';
  return `
  <div class="node-card group cursor-pointer select-none flex flex-col items-center w-[5.5rem] sm:w-28 shrink-0 rounded-2xl transition-all duration-200 hover:-translate-y-1"
       data-id="${id}" onclick="onNodeClick('${id}')" ondblclick="onNodeDblClick('${id}')">
    <div class="relative">
      <img src="${avatarFor(p)}" class="node-photo w-16 h-16 sm:w-[4.6rem] sm:h-[4.6rem] rounded-full border-2 ${borderColor} bg-white shadow-card ${isRootRing} transition-all duration-200" />
    </div>
    <div class="mt-2 text-center leading-tight">
      <p class="text-xs sm:text-[13px] font-semibold text-ink ${isMlName(p)?'font-ml':''} truncate w-24 sm:w-28" title="${personName(p)}">${personName(p)}</p>
      ${years ? `<p class="text-[10px] text-teak-light tracking-wide">${years}</p>` : ''}
    </div>
  </div>`;
}

function renderTree(){
  const container = document.getElementById('treeContainer');
  const root = people[rootId];
  if (!root) {
    document.getElementById('rootLabel').textContent = '';
    container.innerHTML = `
      <div class="text-center py-20">
        <p class="text-teak font-display text-xl mb-1.5">${t('emptyTitle')}</p>
        <p class="text-teak-light text-sm font-serifAccent italic">${t('emptyBody')}</p>
      </div>`;
    return;
  }

  document.getElementById('rootLabel').textContent = personName(root);
  document.getElementById('rootLabel').className = 'font-semibold text-teak font-display text-base ml-1 ' + (isMlName(root) ? 'font-ml' : '');

  // ---- Ancestors ----
  const parentIds = root.parents || [];
  let ancestorsHtml = '';
  if (parentIds.length) {
    const groups = parentIds.filter(pid => people[pid]).map(pid => `<div class="flex flex-col items-center">${nodeCard(pid)}</div>`);
    ancestorsHtml = `
    <div class="flex flex-col items-center mb-1">
      <div class="flex items-start gap-5 sm:gap-9 justify-center flex-wrap">${groups.join('<span class="self-center text-gold-dark font-serifAccent text-xl mt-5">&amp;</span>')}</div>
      <div class="connector-v h-7 rounded-full"></div>
    </div>`;
  }

  // ---- Root + spouses ----
  const spouseIds = (root.spouses || []).filter(sid => people[sid]);
  const coupleIds = [rootId, ...spouseIds];
  const coupleHtml = `
    <div class="flex flex-col items-center">
      <div class="couple-band flex items-center gap-2.5 sm:gap-4 border border-gold-light/80 rounded-[1.4rem] px-4 sm:px-6 py-3.5 shadow-card flex-wrap justify-center">
        ${coupleIds.map((id,i) => (i>0 ? `<span class="text-gold-dark font-serifAccent text-xl px-0.5">&#8901;</span>` : '') + nodeCard(id)).join('')}
      </div>
    </div>`;

  // ---- Descendants ----
  const childIds = root.children || [];
  let descendantsHtml = '';
  if (childIds.length) {
    const items = childIds.filter(cid => people[cid]).map(cid => {
      const child = people[cid];
      const childSpouses = (child.spouses || []).filter(sid => people[sid]);
      const group = [cid, ...childSpouses];
      return `<div class="flex flex-col items-center">
        <div class="connector-v h-7 rounded-full"></div>
        <div class="flex items-center gap-2 bg-gold-soft/40 rounded-2xl px-2.5 py-2.5 border border-gold-light/50">
          ${group.map((id,i)=> (i>0 ? `<span class="text-gold-dark font-serifAccent text-lg px-0.5">&#8901;</span>` : '') + nodeCard(id)).join('')}
        </div>
      </div>`;
    });
    descendantsHtml = `
    <div class="flex flex-col items-center mt-1">
      <div class="connector-v h-7 rounded-full"></div>
      <div class="flex items-start gap-4 sm:gap-7 justify-center flex-wrap max-w-full px-2">${items.join('')}</div>
    </div>`;
  }

  container.innerHTML = `<div class="fade-in flex flex-col items-center py-6 min-w-max mx-auto">
      ${ancestorsHtml}
      ${coupleHtml}
      ${descendantsHtml}
    </div>`;
}

let clickTimer = null;
function onNodeClick(id){
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; return; }
  clickTimer = setTimeout(() => { rootId = id; renderTree(); clickTimer = null; }, 220);
}
function onNodeDblClick(id){
  if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
  openDetailModal(id);
}

  document.getElementById('linkExistingBtn').addEventListener('click', async () => {
    const sel = document.getElementById('existingSelect').value;
    if (!sel) return;
    await linkRelative(anchorId, sel, people[sel], relation);

async function linkRelative(anchorId, otherId, otherPersonData, relation){
  const anchor = Object.assign({}, people[anchorId]);
  const other = Object.assign({}, otherPersonData);
  anchor.spouses = anchor.spouses || []; anchor.children = anchor.children || []; anchor.parents = anchor.parents || [];
  other.spouses = other.spouses || []; other.children = other.children || []; other.parents = other.parents || [];

  if (relation === 'spouse') {
    if (!anchor.spouses.includes(otherId)) anchor.spouses.push(otherId);
    if (!other.spouses.includes(anchorId)) other.spouses.push(anchorId);
  } else if (relation === 'child') {
    if (!anchor.children.includes(otherId)) anchor.children.push(otherId);
    if (!other.parents.includes(anchorId)) other.parents.push(anchorId);
  } else if (relation === 'parent') {
    if (!anchor.parents.includes(otherId)) anchor.parents.push(otherId);
    if (!other.children.includes(anchorId)) other.children.push(anchorId);
  }

  await DB.setPerson(anchorId, anchor);
  await DB.setPerson(otherId, other);
  people[anchorId] = anchor;
  people[otherId] = other;
}

function confirmDelete(id){
  modalShell(`
    <div class="p-6 sm:p-7 text-center">
      <p class="text-sm text-ink mb-5">${t('confirmDelete')}</p>
      <div class="flex justify-center gap-2">
        <button onclick="openDetailModal('${id}')" class="px-4 py-1.5 text-sm rounded-full border border-teak-light text-teak-light hover:bg-gold-soft">${t('cancel')}</button>
        <button onclick="doDelete('${id}')" class="px-4 py-1.5 text-sm rounded-full bg-rose text-parchment hover:bg-rose-light">${t('yes')}</button>
      </div>
    </div>
  `);
}
async function doDelete(id){
  for (const pid of Object.keys(people)) {
    if (pid === id) continue;
    const p = people[pid];
    let changed = false;
    ['parents','spouses','children'].forEach(key => {
      if (p[key] && p[key].includes(id)) { p[key] = p[key].filter(x => x !== id); changed = true; }
    });
    if (changed) await DB.setPerson(pid, p);
  }
  await DB.deletePerson(id);
  delete people[id];
  if (rootId === id) rootId = pickDefaultRoot(people);
  closeModal();
  renderTree();
}

async function resetDemoData(){
  if (!confirm('Reset all data back to the starting demo family? This removes any edits.')) return;
  people = await DB.resetToDummy();
  rootId = pickDefaultRoot(people);
  renderTree();
}

function applyI18nStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder'))));
  const mlTitle = document.querySelector('[data-i18n-force-ml]');

function wireSearch(inputId, resultsId){
  const input = document.getElementById(inputId);
  const results = document.getElementById(resultsId);
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.add('hidden'); results.innerHTML=''; return; }
    const matches = Object.entries(people).filter(([id,p]) =>
      (p.nameEn||'').toLowerCase().includes(q) || (p.nameMl||'').includes(q)
    ).slice(0, 8);
    results.innerHTML = matches.length
      ? matches.map(([id,p]) => `<button class="w-full text-left px-3 py-2 text-sm hover:bg-gold-soft/60 flex items-center gap-2" onclick="selectSearchResult('${id}','${inputId}','${resultsId}')">
          <img src="${avatarFor(p)}" class="w-6 h-6 rounded-full object-cover">
          <span>${p.nameEn}${p.nameMl ? ' · <span class=\"font-ml\">'+p.nameMl+'</span>' : ''}</span>
        </button>`).join('')
      : `<p class="px-3 py-2 text-sm text-teak-light">${t('noResults')}</p>`;
    results.classList.remove('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !results.contains(e.target)) results.classList.add('hidden');
  });
}
function selectSearchResult(id, inputId, resultsId){
  rootId = id;
  renderTree();
  document.getElementById(inputId).value = '';
  document.getElementById(resultsId).classList.add('hidden');
}

wireSearch('searchInputMobile', 'searchResultsMobile');

async function init(){
  applyI18nStatic();
  people = await DB.getAll();
  rootId = pickDefaultRoot(people);
  renderTree();
  DB.subscribe(data => {
    people = data;
    if (!people[rootId]) rootId = pickDefaultRoot(people);
    renderTree();
  });
}
init();


const hear = document.getElementById("hear");
const audio = document.getElementById("audio");

let isEnglish = true;

hear.addEventListener("click", function () {

    if (audio.paused) {

        // Select language audio
        audio.src = isEnglish ? "eng.mp3" : "mal.mp3";

        // Play audio
        audio.play().catch(error => {
            console.log("Audio playback failed:", error);
        });

        // Change language for next click
        isEnglish = !isEnglish;

    } else {
        audio.pause();
    }
});

audio.addEventListener("play", function () {
    hear.classList.add("opacity-50");
    hear.classList.remove("opacity-100");
});

audio.addEventListener("pause", function () {
    hear.classList.remove("opacity-50");
    hear.classList.add("opacity-100");
});

audio.addEventListener("ended", function () {
    hear.classList.remove("opacity-50");
    hear.classList.add("opacity-100");
});



</script>
</body>
</html>
