<!DOCTYPE html>
<html>
<head>
  <title>QR Code Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
</head>
<body>
  <h2>Scan QR Code</h2>
  <div id="reader" style="width: 300px; margin:auto;"></div>
  <div id="result" style="text-align: center; font-size: 1.2em; margin-top: 10px;"></div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-app.firebaseapp.com",
      databaseURL: "https://your-app-default-rtdb.firebaseio.com",
      projectId: "your-app",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const qrCodeSuccessCallback = (decodedText, decodedResult) => {
      document.getElementById("result").textContent = "Scanned: " + decodedText;

      // Update Firebase
      firebase.database().ref("scans").set({
        scanData: decodedText
      });

      html5QrcodeScanner.clear(); // stop scanning
    };

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 10, qrbox: { width: 250, height: 250 } },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(qrCodeSuccessCallback);
  </script>
</body>
</html>
