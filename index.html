
  <!DOCTYPE html>
<html>
<head>
  <title>Mobile QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <h3>Scan QR Code (Mobile)</h3>
  <div id="reader" style="width:300px;"></div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyAZDZphWJ86vZcNDzYwXKR7biW-f9AyLG4",
  authDomain: "universitymodule-8fac5.firebaseapp.com",
  projectId: "universitymodule-8fac5",
  storageBucket: "universitymodule-8fac5.firebasestorage.app",
  messagingSenderId: "154631878754",
  appId: "1:154631878754:web:7243c8fe784abc1626393b",
  measurementId: "G-8TJ9ZWEK6M"
};
    firebase.initializeApp(firebaseConfig);

  const session = new URLSearchParams(location.search).get("session") || "defaultSession";

  function onScanSuccess(decodedText, decodedResult) {
    // STOP the scanner after success
    html5QrcodeScanner.clear().then(() => {
      console.log("Scanner stopped after scan.");
    }).catch(err => {
      console.error("Failed to stop scanner: ", err);
    });

    // SEND data to Firebase
    firebase.database().ref("sessions/" + session).set({
      value: decodedText,
      timestamp: Date.now()
    }).then(() => {
      alert("Scanned and sent: " + decodedText);
    }).catch(error => {
      alert("Error sending to Firebase: " + error);
    });
const beep = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
beep.play();
  }

  const html5QrcodeScanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: 250
  });
  html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
