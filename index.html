
  <!DOCTYPE html>
<html>
<head>
  <title>Mobile QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

<!-- Load Firestore SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>
  <h3>Scan QR Code (Mobile)</h3>
  <div id="reader" style="width:300px;"></div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyAZDZphWJ86vZcNDzYwXKR7biW-f9AyLG4",
  authDomain: "universitymodule-8fac5.firebaseapp.com",
  projectId: "universitymodule-8fac5",
  storageBucket: "universitymodule-8fac5.firebasestorage.app",
  messagingSenderId: "154631878754",
  appId: "1:154631878754:web:7243c8fe784abc1626393b",
  measurementId: "G-8TJ9ZWEK6M"
};
  
 // Initialize Firebase & Firestore
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Read session from URL
  const session = new URLSearchParams(location.search).get("session") || "defaultSession";

  // On QR Code success
  function onScanSuccess(decodedText, decodedResult) {
    html5QrcodeScanner.clear().then(() => {
      console.log("Scanner stopped after scan.");
    });

const beep = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
beep.play();


    // Save to Firestore
    db.collection("scans").doc(session).set({
      value: decodedText,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      alert("Data sent to Firestore: " + decodedText);
    }).catch((error) => {
      alert("Error writing to Firestore: " + error);
    });
  }

  // Start the QR Scanner
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", {
    fps: 10,
    qrbox: 250
  });
  html5QrcodeScanner.render(onScanSuccess);
</script>


</body>
</html>
