
  <!DOCTYPE html>
<html>
<head>
  <title>Mobile QR Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <h3>Scan QR Code (Mobile)</h3>
  <div id="reader" style="width:300px;"></div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyAZDZphWJ86vZcNDzYwXKR7biW-f9AyLG4",
  authDomain: "universitymodule-8fac5.firebaseapp.com",
  projectId: "universitymodule-8fac5",
  storageBucket: "universitymodule-8fac5.firebasestorage.app",
  messagingSenderId: "154631878754",
  appId: "1:154631878754:web:7243c8fe784abc1626393b",
  measurementId: "G-8TJ9ZWEK6M"
};
    firebase.initializeApp(firebaseConfig);

    const session = new URLSearchParams(location.search).get("session") || "defaultSession";

    function onScanSuccess(decodedText) {
      firebase.database().ref("sessions/" + session).set({
        value: decodedText,
        timestamp: Date.now()
      }).then(() => {
        alert("Data sent: " + decodedText);
      });
    }

    const qrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    qrScanner.render(onScanSuccess);
  </script>
</body>
</html>
